schema_version: "1.0"
scenario_id: windows-process-marker
scenario_version: "0.1.0"
name: Windows Process Marker
description: Emits a harmless correlation marker in a child process command line.
platform: windows
attack_technique: T1059.003
action: emit_process_marker
execution:
  handler: builtin.emit_process_marker
  network_access: none
risk_level: low
timeout_seconds: 30
cleanup_required: true
cleanup:
  strategy: verify_no_artifacts
  timeout_seconds: 10
  max_attempts: 1
  verify_absence: true
parameter_schema: {}
expected_telemetry:
  provider: sysmon
  event_ids:
    - 1
  required_fields:
    - process.name
    - process.command_line
    - host.name
    - user.name
