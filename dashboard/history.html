<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Filter and review ProofLayer test history."><title>ProofLayer — Test History</title><link rel="stylesheet" href="/app.css"></head>
<body><div class="shell"><header class="topbar"><a class="brand" href="/history.html"><span class="brand-mark">PL</span>ProofLayer</a><span class="workspace-chip" id="workspace-name">Loading workspace…</span></header><div class="layout">
  <aside class="sidebar"><p class="nav-label">Workspace</p><nav class="nav" aria-label="Primary"><a href="/history.html" aria-current="page">Test history</a><a href="/test-new.html">New test</a><a href="/hosts.html">Hosts</a><a href="/schedules.html">Schedules</a></nav></aside>
  <main><p class="breadcrumb">Tests / History</p><div class="page-head"><div><h1>Test history</h1><p class="subtitle">Trace every accepted validation by host, scenario, time, and outcome.</p></div><a class="button" href="/test-new.html">Run new test</a></div>
  <form class="panel" id="filters"><div class="grid"><label class="field">From<input id="from" type="date"></label><label class="field">To<input id="to" type="date"></label><label class="field">Host<select id="host"><option value="">All hosts</option></select></label><label class="field">Scenario<select id="scenario"><option value="">All scenarios</option></select></label></div><div class="actions"><button class="button secondary" id="clear" type="button">Clear</button><button class="button" type="submit">Apply filters</button></div></form>
  <section class="panel"><div class="table-wrap"><table><thead><tr><th>Requested</th><th>Host</th><th>Scenario</th><th>Status</th><th>Outcome</th><th>Correlation ID</th></tr></thead><tbody id="history-rows"></tbody></table></div><p class="message" id="message" role="status"></p><div class="pagination"><button class="button secondary" id="previous" type="button">Previous</button><span id="page-label">Page 1 of 1</span><button class="button secondary" id="next" type="button">Next</button></div></section></main>
</div></div><script src="/app.js?v=35"></script><script>
  (async () => { const { initialize, api, clear, node } = window.ProofLayer; const rows = document.querySelector("#history-rows"); const message = document.querySelector("#message"); const host = document.querySelector("#host"); const scenario = document.querySelector("#scenario"); const hostNames = new Map(); const scenarioNames = new Map(); let page = 1; let pages = 1;
    function td(text, className) { return node("td", text, className); } function dateBoundary(value, end) { if (!value) return ""; const date = new Date(`${value}T${end ? "23:59:59.999" : "00:00:00.000"}`); return date.toISOString(); }
    async function load() { message.textContent = ""; try { const query = new URLSearchParams({ page: String(page), page_size: "20" }); if (host.value) query.set("host_id", host.value); if (scenario.value) query.set("scenario_id", scenario.value); const from = dateBoundary(document.querySelector("#from").value, false); const to = dateBoundary(document.querySelector("#to").value, true); if (from) query.set("from", from); if (to) query.set("to", to); const data = await api(`/v1/test-runs?${query}`); pages = Math.max(1, data.total_pages || 1); clear(rows); (data.items || []).forEach((item) => { const tr = node("tr"); const statusCell = node("td"); statusCell.append(node("span", item.status, `status-pill status-${item.status}`)); const outcomeCell = node("td"); outcomeCell.append(node("span", item.outcome.replaceAll("_", " "), `status-pill outcome-${item.outcome}`)); tr.append(td(new Date(item.requested_at).toLocaleString()), td(hostNames.get(item.host_id) || item.host_id), td(scenarioNames.get(item.scenario_id) || item.scenario_id), statusCell, outcomeCell, td(item.correlation_id, "technical")); rows.append(tr); }); if (!(data.items || []).length) { const tr = node("tr"); const cell = td("No test runs match these filters.", "empty"); cell.colSpan = 6; tr.append(cell); rows.append(tr); } document.querySelector("#page-label").textContent = `Page ${data.page || page} of ${pages} · ${data.total_items || 0} runs`; document.querySelector("#previous").disabled = page <= 1; document.querySelector("#next").disabled = page >= pages; } catch { clear(rows); message.textContent = "Test history could not be loaded. Check the filters and try again."; message.className = "message error"; } }
    try { await initialize(); const [catalog, hosts] = await Promise.all([api("/v1/scenarios"), api("/v1/hosts")]); (hosts.items || []).forEach((item) => { hostNames.set(item.id, item.name); const option = node("option", item.name); option.value = item.id; host.append(option); }); (catalog.items || []).forEach((item) => { scenarioNames.set(item.id, item.name); const option = node("option", item.name); option.value = item.id; scenario.append(option); }); await load(); document.querySelector("#filters").addEventListener("submit", (event) => { event.preventDefault(); page = 1; load(); }); document.querySelector("#clear").addEventListener("click", () => { document.querySelector("#filters").reset(); page = 1; load(); }); document.querySelector("#previous").addEventListener("click", () => { if (page > 1) { page -= 1; load(); } }); document.querySelector("#next").addEventListener("click", () => { if (page < pages) { page += 1; load(); } }); } catch { message.textContent = "The history workspace could not be loaded."; message.className = "message error"; }
  })();
</script></body></html>
